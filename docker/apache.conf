<VirtualHost *:8000>
    ServerName licufide.brahem.space
    # PERMITE ENTRAR DESDE LOCALHOST: Apache aceptará peticiones locales bajo este mismo VirtualHost
    ServerAlias localhost 127.0.0.1

    # 1. Rutas del entorno virtual y código
    WSGIDaemonProcess django_app python-home=/env python-path=/app
    WSGIProcessGroup django_app
    
    # Obliga a Apache a usar el intérprete principal para soportar librerías de Rust/C
    WSGIApplicationGroup %{GLOBAL}

    # 2. Ruta exacta del archivo dentro del contenedor
    WSGIScriptAlias / /app/config/wsgi.py

    # 3. Permisos para la carpeta contenedora de wsgi.py (Principio de menor privilegio)
    <Directory /app/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # 4. Rutas para tus estáticos y media
    Alias /static /app/staticfiles
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    Alias /media /app/media
    <Directory /app/media>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>